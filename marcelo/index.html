<!DOCTYPE html>
<html lang="pt">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Marcelo Moreira | UniFlex PRO</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#ececec;
    display:flex;
    justify-content:center;
    padding:20px;
}

.card{
    width:100%;
    max-width:420px;
    background:white;
    border-radius:30px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.banner{
    height:240px;
    background-image:url('./banner.png');
    background-size:cover;
    background-position:center;
    position:relative;
}

.profile{
    position:absolute;
    bottom:-70px;
    left:50%;
    transform:translateX(-50%);
    width:150px;
    height:150px;
    border-radius:50%;
    border:6px solid white;
    object-fit:cover;
    box-shadow:0 8px 20px rgba(0,0,0,.20);
}

.content{
    padding:95px 30px 40px 30px;
}

.name{
    text-align:center;
    font-size:32px;
    font-weight:700;
    color:#233f72;
}

.logo{
    display:block;
    width:180px;
    margin:10px auto 10px auto;
}

.role{
    text-align:center;
    font-size:16px;
    color:#555;
    margin-bottom:30px;
}

.info{
    max-width:320px;
    margin:auto;
}

.info a{
    display:flex;
    align-items:center;
    gap:15px;
    padding:12px 0;
    color:#555;
    text-decoration:none;
    font-size:16px;
}

.info i{
    width:26px;
    color:#233f72;
    font-size:24px;
}

.social{
    display:flex;
    justify-content:center;
    gap:25px;
    margin-top:30px;
    margin-bottom:30px;
}

.social a{
    color:#233f72;
    font-size:42px;
    text-decoration:none;
    transition:.3s;
}

.social a:hover{
    transform:scale(1.15);
}

.save-contact{
    display:block;
    text-align:center;
    background:#233f72;
    color:white;
    text-decoration:none;
    padding:18px;
    border-radius:14px;
    font-size:18px;
    font-weight:600;
}

.save-contact:hover{
    background:#1b3158;
}

.qr{
    width:150px;
    height:150px;
    margin:30px auto 0 auto;
    border:3px dashed #d0d0d0;
    border-radius:12px;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#999;
    font-size:14px;
}

.footer{
    text-align:center;
    margin-top:25px;
    color:#888;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="card">

    <div class="banner">

        <img src="./foto.jpeg"
             alt="Marcelo Moreira"
             class="profile">

    </div>

    <div class="content">

        <div class="name">
            Marcelo Moreira
        </div>

        <img src="./logo.png"
             alt="UniFlex PRO"
             class="logo">

        <div class="role">
            Diretor de Projetos de Construção
        </div>

        <div class="info">

            <a href="mailto:marcelo@uniflexpro.com">
                <i class="fas fa-envelope"></i>
                <span>marcelo@uniflexpro.com</span>
            </a>

            <a href="tel:+351966308710">
                <i class="fas fa-phone"></i>
                <span>+351 966 308 710</span>
            </a>

            <a href="https://wa.me/351966308710" target="_blank">
                <i class="fab fa-whatsapp"></i>
                <span>WhatsApp</span>
            </a>

            <a href="https://uniflexpro.com" target="_blank">
                <i class="fas fa-globe"></i>
                <span>uniflexpro.com</span>
            </a>

        </div>

        <div class="social">

            <a href="https://www.facebook.com/uniflexprolda"
               target="_blank"
               title="Facebook">
                <i class="fab fa-facebook-square"></i>
            </a>

            <a href="https://wa.me/351966308710"
               target="_blank"
               title="WhatsApp">
                <i class="fab fa-whatsapp-square"></i>
            </a>

            <a href="https://uniflexpro.com"
               target="_blank"
               title="Website">
                <i class="fas fa-globe"></i>
            </a>

            <a href="./contacto.vcf"
               title="Guardar Contacto">
                <i class="fas fa-address-card"></i>
            </a>

        </div>

        <a href="./contacto.vcf" class="save-contact">
            Guardar Contacto
        </a>

        <div class="qr">
            QR CODE
        </div>

        <div class="footer">
            UniFlex PRO
        </div>

    </div>

</div>

</body>
</html>
