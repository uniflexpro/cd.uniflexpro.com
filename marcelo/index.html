<!DOCTYPE html>
<html lang="pt">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Marcelo Moreira | UniFlex PRO</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#f3f5f7;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:420px;
}

.card{
    background:#ffffff;
    border-radius:25px;
    overflow:hidden;
    box-shadow:0 10px 35px rgba(0,0,0,0.15);
}

.banner{
    height:220px;
    background:linear-gradient(
        135deg,
        #003366 0%,
        #0066b3 50%,
        #0094ff 100%
    );
    position:relative;
}

.logo{
    width:180px;
    position:absolute;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    object-fit:contain;
}

.profile{
    width:150px;
    height:150px;
    border-radius:50%;
    object-fit:cover;
    border:5px solid #ffffff;
    position:absolute;
    bottom:-75px;
    left:50%;
    transform:translateX(-50%);
    box-shadow:0 5px 20px rgba(0,0,0,0.25);
}

.content{
    padding:95px 25px 30px;
}

.name{
    text-align:center;
    font-size:30px;
    font-weight:700;
    color:#222;
}

.role{
    text-align:center;
    color:#666;
    font-size:15px;
    margin-top:10px;
    line-height:1.6;
}

.icons{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:15px;
    margin-top:35px;
}

.icons a{
    width:58px;
    height:58px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    color:#fff;
    font-size:24px;
    transition:0.3s;
}

.icons a:hover{
    transform:scale(1.08);
}

.phone{
    background:#003366;
}

.whatsapp{
    background:#25D366;
}

.email{
    background:#EA4335;
}

.website{
    background:#444444;
}

.facebook{
    background:#1877F2;
}

.contact{
    background:#f5a623;
}

.save-contact{
    display:block;
    text-align:center;
    margin-top:30px;
    padding:16px;
    border-radius:12px;
    background:#003366;
    color:white;
    text-decoration:none;
    font-weight:bold;
    font-size:16px;
}

.save-contact:hover{
    background:#0056a6;
}

.qrcode{
    margin-top:30px;
    text-align:center;
}

.qrcode-box{
    width:150px;
    height:150px;
    margin:auto;
    border:2px dashed #d0d0d0;
    border-radius:12px;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#999;
    font-size:14px;
}

.footer{
    text-align:center;
    margin-top:25px;
    color:#666;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

    <div class="card">

        <div class="banner">

            <img src="logo.png"
                 alt="UniFlex PRO"
                 class="logo">

            <img src="foto.jpeg"
                 alt="Marcelo Moreira"
                 class="profile">

        </div>

        <div class="content">

            <div class="name">
                Marcelo Moreira
            </div>

            <div class="role">
                Diretor de Projetos de Construção
            </div>

            <div class="icons">

                <a href="tel:+351966308710"
                   class="phone"
                   title="Telefone">
                    <i class="fas fa-phone"></i>
                </a>

                <a href="https://wa.me/351966308710"
                   target="_blank"
                   class="whatsapp"
                   title="WhatsApp">
                    <i class="fab fa-whatsapp"></i>
                </a>

                <a href="mailto:marcelo@uniflexpro.com"
                   class="email"
                   title="Email">
                    <i class="fas fa-envelope"></i>
                </a>

                <a href="https://uniflexpro.com"
                   target="_blank"
                   class="website"
                   title="Website">
                    <i class="fas fa-globe"></i>
                </a>

                <a href="https://www.facebook.com/uniflexprolda"
                   target="_blank"
                   class="facebook"
                   title="Facebook">
                    <i class="fab fa-facebook-f"></i>
                </a>

                <a href="contacto.vcf"
                   class="contact"
                   title="Guardar Contacto">
                    <i class="fas fa-address-card"></i>
                </a>

            </div>

            <a href="contacto.vcf" class="save-contact">
                Guardar Contacto
            </a>

            <div class="qrcode">

                <div class="qrcode-box">
                    QR CODE
                </div>

            </div>

            <div class="footer">
                UniFlex PRO
            </div>

        </div>

    </div>

</div>

</body>
</html>
