<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Marcelo Moreira | UniFlex PRO</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#f2f2f2;
    display:flex;
    justify-content:center;
    padding:20px;
}

.card{
    width:100%;
    max-width:420px;
    background:white;
    border-radius:25px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.banner{
    height:220px;
    background-image:url('banner.png');
    background-size:cover;
    background-position:center;
    position:relative;
}

.profile{
    width:160px;
    height:160px;
    border-radius:50%;
    object-fit:cover;
    border:5px solid white;
    position:absolute;
    bottom:-80px;
    left:50%;
    transform:translateX(-50%);
    box-shadow:0 5px 20px rgba(0,0,0,.25);
}

.content{
    padding:100px 25px 30px;
    text-align:center;
}

.name{
    font-size:36px;
    font-weight:bold;
    color:#1f3a63;
}

.logo{
    width:140px;
    margin:15px auto;
    display:block;
}

.role{
    color:#555;
    font-size:18px;
    margin-bottom:30px;
}

.info{
    text-align:left;
    margin:0 auto 25px;
    max-width:300px;
}

.info a{
    display:flex;
    align-items:center;
    gap:15px;
    text-decoration:none;
    color:#555;
    padding:10px 0;
    font-size:16px;
}

.info i{
    font-size:22px;
    color:#1f3a63;
    width:25px;
}

.social{
    display:flex;
    justify-content:center;
    gap:20px;
    margin:25px 0;
}

.social a{
    color:#1f3a63;
    font-size:34px;
    text-decoration:none;
    transition:.3s;
}

.social a:hover{
    transform:scale(1.15);
}

.save-contact{
    display:block;
    width:100%;
    background:#1f3a63;
    color:white;
    padding:15px;
    border-radius:10px;
    text-decoration:none;
    font-weight:bold;
    margin-bottom:25px;
}

.qr{
    width:140px;
    height:140px;
    margin:0 auto;
    border:2px dashed #ccc;
    border-radius:12px;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#999;
    font-size:14px;
}

.footer{
    margin-top:20px;
    color:#777;
    font-weight:bold;
}

</style>
</head>

<body>

<div class="card">

    <div class="banner">
        <img src="foto.jpeg" alt="Marcelo Moreira" class="profile">
    </div>

    <div class="content">

        <div class="name">
            Marcelo Moreira
        </div>

        <img src="logo.png" alt="UniFlex PRO" class="logo">

        <div class="role">
            Diretor de Projetos de Construção
        </div>

        <div class="info">

            <a href="mailto:marcelo@uniflexpro.com">
                <i class="fas fa-envelope"></i>
                marcelo@uniflexpro.com
            </a>

            <a href="tel:+351966308710">
                <i class="fas fa-phone"></i>
                +351 966 308 710
            </a>

            <a href="https://wa.me/351966308710" target="_blank">
                <i class="fab fa-whatsapp"></i>
                WhatsApp
            </a>

            <a href="https://uniflexpro.com" target="_blank">
                <i class="fas fa-globe"></i>
                uniflexpro.com
            </a>

        </div>

        <div class="social">

            <a href="https://www.facebook.com/uniflexprolda"
               target="_blank"
               title="Facebook">
                <i class="fab fa-facebook-square"></i>
            </a>

            <a href="https://wa.me/351966308710"
               target="_blank"
               title="WhatsApp">
                <i class="fab fa-whatsapp-square"></i>
            </a>

            <a href="https://uniflexpro.com"
               target="_blank"
               title="Website">
                <i class="fas fa-globe"></i>
            </a>

            <a href="contacto.vcf"
               title="Guardar Contacto">
                <i class="fas fa-address-card"></i>
            </a>

        </div>

        <a class="save-contact" href="contacto.vcf">
            Guardar Contacto
        </a>

        <div class="qr">
            QR CODE
        </div>

        <div class="footer">
            UniFlex PRO
        </div>

    </div>

</div>

</body>
</html>
