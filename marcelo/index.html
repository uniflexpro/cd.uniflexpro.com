<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Marcelo Moreira | UniFlex PRO</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial, Helvetica, sans-serif;
            background:#f5f5f5;
            display:flex;
            justify-content:center;
            padding:30px 15px;
        }

        .card{
            width:100%;
            max-width:420px;
            background:#fff;
            border-radius:25px;
            overflow:hidden;
            box-shadow:0 10px 30px rgba(0,0,0,.15);
        }

        .banner{
            height:180px;
            background:linear-gradient(
                135deg,
                #003366 0%,
                #005fa3 100%
            );
            position:relative;
        }

        .logo{
            width:160px;
            position:absolute;
            top:20px;
            left:50%;
            transform:translateX(-50%);
        }

        .profile{
            width:140px;
            height:140px;
            border-radius:50%;
            border:5px solid white;
            object-fit:cover;
            position:absolute;
            bottom:-70px;
            left:50%;
            transform:translateX(-50%);
            box-shadow:0 5px 15px rgba(0,0,0,.2);
        }

        .content{
            padding:90px 25px 30px;
        }

        h1{
            text-align:center;
            color:#222;
            margin-bottom:10px;
            font-size:32px;
        }

        .position{
            text-align:center;
            color:#666;
            line-height:1.5;
