<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniFlex PRO Digital Cards</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f4f6f8;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            margin:0;
        }

        .card{
            background:white;
            padding:40px;
            border-radius:15px;
            text-align:center;
            width:350px;
            box-shadow:0 5px 20px rgba(0,0,0,0.15);
        }

        h1{
            color:#003366;
        }

        a{
            display:block;
            margin:10px 0;
            padding:12px;
            background:#0078d4;
            color:white;
            text-decoration:none;
            border-radius:6px;
        }

        a:hover{
            background:#005fa3;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>UniFlex PRO</h1>

    <p>Digital Business Cards</p>

    <a href="#">Marcelo Moreira</a>

    <a href="#">Licínio Moreira</a>

    <a href="#">Felipe Moreira</a>

</div>

</body>
</html>
